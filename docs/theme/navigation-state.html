<script>
/* Restore the sidebar synchronously, before revealing its first frame. */
(() => {
  "use strict";
  const root = document.documentElement;
  try {
    const navigationKey = "forge-docs-navigation-groups";
    let state = {};
    try {
      const saved = JSON.parse(localStorage.getItem(navigationKey));
      if (saved && typeof saved === "object" && !Array.isArray(saved)) state = saved;
    } catch { /* Keep native details usable without storage. */ }
    const restoreGroups = scope => {
      scope.querySelectorAll("[data-nav-group]").forEach(group => {
        if (group.dataset.navRestored) return;
        group.dataset.navRestored = "true";
        const id = group.dataset.navGroup;
        if (group.dataset.active === "true") group.open = true;
        else if (typeof state[id] === "boolean") group.open = state[id];
        group.addEventListener("toggle", () => {
          state[id] = group.open;
          try { localStorage.setItem(navigationKey, JSON.stringify(state)); } catch { /* Ignore unavailable storage. */ }
        });
      });
    };
    window.forgeRestoreNavigationGroups = restoreGroups;
    const nav = document.querySelector(".chapter-nav");
    if (!nav) return;
    restoreGroups(nav);
    const siteRoot = new URL(`${document.body.dataset.baseUrl || "."}/`, location.href).pathname;
    const scrollKey = `forge-docs-navigation-scroll:${siteRoot}`;
    try {
      const saved = sessionStorage.getItem(scrollKey);
      if (saved !== null && Number.isFinite(Number(saved)) && Number(saved) >= 0) nav.scrollTop = Number(saved);
    } catch { /* Ignore unavailable storage. */ }
    const save = () => {
      try { sessionStorage.setItem(scrollKey, String(nav.scrollTop)); } catch { /* Ignore unavailable storage. */ }
    };
    nav.addEventListener("scroll", save, { passive: true });
    nav.addEventListener("click", save);
    window.addEventListener("pagehide", save);
  } finally {
    root.classList.remove("navigation-pending");
  }
})();
</script>
